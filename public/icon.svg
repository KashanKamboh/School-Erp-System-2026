<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Inner subtle border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.3"/>

  <!-- School Graduation Cap / Book Icon -->
  <g transform="translate(106, 120)" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mortarboard Cap top -->
    <path d="M150 20 L280 85 L150 150 L20 85 Z" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="20"/>
    <!-- Mortarboard Lower Cap -->
    <path d="M65 110 L65 190 C65 245 235 245 235 190 L235 110" stroke="#FFFFFF" stroke-width="18"/>
    <!-- Tassel -->
    <path d="M280 85 L280 180 L290 190" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="290" cy="195" r="8" fill="#FDE047"/>
    
    <!-- Open Knowledge Book underneath -->
    <path d="M40 240 Q150 220 150 270 Q150 220 260 240 L260 280 Q150 260 150 310 Q150 260 40 280 Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="8"/>
  </g>
</svg>
